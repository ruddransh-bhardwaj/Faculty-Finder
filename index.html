<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faculty Finder Pro - Role Selection</title>
<style>
:root{--p:#2563eb;--bg:#f5f7fb}
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{margin:0;background:var(--bg);color:#222; overflow-x: hidden;}
/* --- MAIN APP HEADER (Hidden on Portal) --- */
#mainAppHeader {display:none; justify-content:space-between; align-items:center; padding:18px 8%; background:#fff; position:sticky; top:0; box-shadow:0 2px 10px rgba(0,0,0,.05); z-index: 100;}
nav{display:flex;gap:18px;align-items:center}nav a{text-decoration:none;color:#444; cursor:pointer;}
.btn-primary,button{background:var(--p);color:#fff;border:none;padding:11px 18px;border-radius:10px;cursor:pointer; font-weight:600; transition:0.2s;}
button:hover{opacity:0.9;}
.btn-danger{background:#dc2626;}
.btn-success{background:#16a34a;}
/* Main Views */
.view-section { display: none; }
.active-view { display: block; }
/* ================= CLEAN PORTAL STYLES ================= */
.portal-centered { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f4f6f9; text-align: center; padding: 20px; }
.portal-centered h1 { font-size: 32px; color: #1b5b97; margin-bottom: 10px; font-family: Inter, Arial, sans-serif; font-weight: bold;}
.portal-centered p { color: #666; margin-bottom: 40px; }
.vit-cards-row { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
.vit-card { background: white; width: 280px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); padding: 25px; text-align: center; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.3s; }
.vit-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.12); }
.vit-card-icon { font-size: 45px; }
.vit-card-content { text-align: right; }
.vit-card-content h3 { margin: 0 0 12px 0; font-size: 20px; }
.vit-btn { padding: 8px 18px; border-radius: 4px; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold;}
.card-student { border-top: 4px solid #007bff; } .card-student h3 { color: #007bff; } .card-student .vit-btn { background: #007bff; }
.card-employee { border-top: 4px solid #d4a017; } .card-employee h3 { color: #d4a017; } .card-employee .vit-btn { background: #d4a017; }
